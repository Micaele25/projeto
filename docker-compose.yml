version: '3.8'

services:
  app:
    container_name: mk_app
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - mk_network
    depends_on:
      - db

  db:
    container_name: mk_db
    image: postgres:13
    environment:
      POSTGRES_DB: mk_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - mk_network
    volumes:
      - mk_db_data:/var/lib/postgresql/data

networks:
  mk_network:
    driver: bridge

volumes:
  mk_db_data:
