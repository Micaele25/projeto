<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Curso</title>
</head>
<body>
    <h1>Adicionar Curso</h1>
    <form action="/salvar/curso" method="post">
        <label for="nome_curso">Nome do Curso:</label>
        <input type="text" id="nome_curso" name="nome_curso" required><br><br>

        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" name="descricao" required><br><br>

        <label for="duracao">Duração (em meses):</label>
        <input type="number" id="duracao" name="duracao" required><br><br>

        <button type="submit">Adicionar</button>
    </form>

    <br>
    <!-- Link para retornar à página de listagem de cursos -->
    <a href="/listar/cursos">Voltar para a lista de cursos</a>
</body>
</html>
