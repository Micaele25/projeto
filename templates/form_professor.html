<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Professor</title>
</head>
<body>
    <h1>Adicionar Professor</h1>
    <form action="/salvar/professor" method="post">
        <label for="nome_professor">Nome:</label>
        <input type="text" id="nome_professor" name="nome_professor" required><br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="especialidade">Especialidade:</label>
        <input type="text" id="especialidade" name="especialidade" required><br><br>

        <button type="submit">Adicionar</button>
    </form>

    <br>
    <!-- Link para retornar à página de listagem de professores -->
    <a href="/listar/professores">Voltar para a lista de professores</a>
</body>
</html>
